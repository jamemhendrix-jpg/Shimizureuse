<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>📈 導き — 上昇線</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #1baf7a;
    --series-3: #c9852b;
    --series-4: #8a5fbf;
    --seq-100: #cde2fb;
    --seq-450: #2a78d6;
    --good: #006300;
    --accent-wash: rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #199e70;
      --series-3: #d99a44;
      --series-4: #a685d9;
      --seq-100: #184f95;
      --seq-450: #3987e5;
      --good: #0ca30c;
      --accent-wash: rgba(57,135,229,0.14);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px 16px 64px;
  }
  main { max-width: 720px; margin: 0 auto; }
  header.app { margin-bottom: 16px; }
  header.app h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.01em; }
  header.app p { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  header.app a { color: var(--series-1); font-weight: 600; text-decoration: none; }
  header.app a:hover { text-decoration: underline; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 14px; }
  .card h2 .sub { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 8px; }

  input, select, button {
    font: inherit; color: var(--text-primary);
    background: var(--page); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 14px;
  }
  input:focus, button:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  /* 実効タップ領域は44px以上を確保する(見た目のサイズは極力変えず、内部余白で確保) */
  button {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button.primary { background: var(--series-1); color: #fff; border-color: transparent; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; cursor: pointer; color: var(--text-secondary); }
  button.ghost:hover { background: var(--accent-wash); }
  button.del-x {
    min-width: 44px; min-height: 44px;
    padding: 3px 10px; font-size: 14px; line-height: 1.4;
    color: var(--text-muted); border: none; background: transparent;
    border-radius: 8px; cursor: pointer;
  }
  button.del-x:hover { background: var(--accent-wash); color: var(--text-primary); }
  .empty-note { color: var(--text-muted); font-size: 13.5px; padding: 12px 0; }
  .field { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
  .field label { font-size: 12px; color: var(--text-muted); }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .add-row input[type="text"] { flex: 1; min-width: 200px; }
  .data-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .tg-chip {
    display: inline-block; font-size: 12.5px; padding: 4px 12px; border-radius: 999px;
    background: var(--accent-wash); color: var(--text-secondary); border: none; cursor: default;
  }
  /* button.tg-chip はタップ対象なので、base の button{min-height:44px} をそのまま活かす(ここでは上書きしない) */
  button.tg-chip { cursor: pointer; display: inline-flex; align-items: center; }
  button.tg-chip:disabled { opacity: 0.4; cursor: not-allowed; }
  button.tg-chip.selected { background: var(--series-1); color: #fff; font-weight: 600; }
  .meter { height: 8px; border-radius: 4px; background: var(--seq-100); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: 4px; background: var(--seq-450); min-width: 2px; transition: width .4s ease; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button { padding: 10px 20px; font-size: 14.5px; }

  /* ---- 概念ヘッダー ---- */
  .concept-card { border: 2px solid var(--series-1); }
  .concept-title { font-size: 21px; font-weight: 700; line-height: 1.45; }
  .concept-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

  /* ---- 上昇イメージ ---- */
  .rising-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; margin-bottom: 8px; }
  .rising-label .sub { font-weight: 400; margin-left: 8px; }
  .rising-text { font-size: 16.5px; font-weight: 600; line-height: 1.75; }

  /* ---- 今週の賭け ---- */
  ul.bet-list { list-style: none; }
  ul.bet-list li { display: flex; align-items: center; gap: 6px; padding: 2px; border-bottom: 1px solid var(--grid); }
  ul.bet-list li:last-child { border-bottom: none; }
  .bet-row-label {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
    min-height: 44px; padding: 10px 6px; margin: 0; border-radius: 8px; cursor: pointer;
  }
  .bet-row-label:hover { background: var(--accent-wash); }
  ul.bet-list input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--series-1); cursor: pointer; flex: none; }
  .bet-text { flex: 1; font-size: 15px; }
  .bet-text.bet-cleared { color: var(--text-muted); text-decoration: line-through; }
  .template-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .limit-msg { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }

  /* ---- 清算 ---- */
  .settle-date-label { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 12px; }
  .settle-question { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .settle-comment { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); }

  /* ---- スコア表示 ---- */
  .score-value { font-size: 32px; font-weight: 700; line-height: 1.2; }
  .score-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }

  /* ---- チャート(コンパスのパターンを踏襲) ---- */
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-secondary); flex-wrap: wrap; }
  .legend .key { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; border-radius: 1px; }
  .legend .k1 { border-color: var(--series-1); border-top-width: 3px; }
  .legend .k2 { border-color: var(--series-2); border-top-style: dashed; }
  .legend .k3 { border-color: var(--text-muted); opacity: 0.6; }
  .legend .k4 { border-color: var(--text-secondary); border-top-style: dotted; opacity: 0.7; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-wrap:focus { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 8px; }
  .chart-empty { color: var(--text-muted); font-size: 13.5px; padding: 30px 0; text-align: center; }
  .table-view { margin-top: 12px; font-size: 13px; overflow-x: auto; }
  .table-view table { border-collapse: collapse; min-width: 320px; }
  .table-view th, .table-view td { padding: 4px 12px; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
  .table-view th:first-child, .table-view td:first-child { text-align: left; }
  .table-view th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  details#tag-detail { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
  details#tag-detail summary { cursor: pointer; font-size: 13.5px; color: var(--text-secondary); font-weight: 600; }

  /* ---- メンターのポジション管理 / AI連携 ---- */
  .position-text { font-size: 14.5px; line-height: 1.7; }
  .ai-review-note { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 12px; }

  footer.app { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <header class="app">
    <h1>📈 導き</h1>
    <p>週に賭けろ。線を見ろ。</p>
    <p style="margin-top:6px"><a href="./index.html">🧭 コンパスへ</a></p>
  </header>

  <!-- 1. 概念ヘッダー -->
  <section class="card concept-card">
    <div class="concept-title">好きな車に乗る、自由な生活</div>
    <div class="concept-sub">そのために — 100億<span id="concept-assets"></span></div>
  </section>

  <!-- 2. 上昇イメージ -->
  <section class="card" id="rising-card" aria-live="polite">
    <div class="rising-label">上昇イメージ<span class="sub" id="rising-week-label"></span></div>
    <div class="rising-text" id="rising-image-text"></div>
  </section>

  <!-- 3. 今週の賭け -->
  <section class="card" id="bets-card">
    <h2>今週の賭け<span class="sub" id="bets-week-label"></span></h2>
    <div id="bets-score"></div>
    <div id="bets-body"></div>
  </section>

  <!-- 4. 清算 -->
  <section class="card" id="settle-card" hidden>
    <h2>清算<span class="sub">線に答えを刻め</span></h2>
    <div id="settle-body"></div>
  </section>

  <!-- 5. 上昇線 -->
  <section class="card">
    <div class="chart-head">
      <h2 style="margin:0">上昇線<span class="sub" id="line-chart-sub"></span></h2>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div class="legend" id="line-chart-legend" hidden>
          <span><i class="key k1"></i>総合累積</span>
          <span><i class="key k2"></i>実感累積</span>
          <span><i class="key k3"></i>資産</span>
          <span><i class="key k4"></i>4週前の自分</span>
        </div>
        <button class="ghost" id="toggle-line-table" type="button" hidden>表で見る</button>
      </div>
    </div>
    <div class="chart-wrap" id="line-chart-wrap" tabindex="0" role="img" aria-label="上昇線チャート">
      <div id="line-chart"></div>
    </div>
    <div class="table-view" id="line-table-view" hidden></div>

    <details id="tag-detail" hidden>
      <summary>詳細(タグ別の4本)</summary>
      <div class="chart-wrap" id="tag-chart-wrap" style="margin-top:12px" tabindex="0" role="img" aria-label="タグ別上昇線チャート。稼ぐ・守る・増やす・整えるの4本。">
        <div id="tag-chart"></div>
      </div>
      <div class="table-view" id="tag-table-view"></div>
    </details>
  </section>

  <!-- 6. メンターのポジション管理 -->
  <section class="card">
    <h2>メンターのポジション管理<span class="sub">枠(slots)の話だけ</span></h2>
    <div id="position-body"></div>
  </section>

  <!-- 7. AI連携 -->
  <section class="card">
    <h2>🤖 AI連携<span class="sub">Claudeに週次を見てもらう</span></h2>
    <div id="ai-body"></div>
  </section>

  <!-- 設定 -->
  <section class="card">
    <h2>設定とデータ</h2>
    <div class="data-actions">
      <button class="ghost" type="button" id="export-btn">データを書き出す(JSON)</button>
      <button class="ghost" type="button" id="import-btn">データを読み込む</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </section>

  <footer class="app">「導き」のデータはこの端末の中だけに保存されます。コンパスのデータは読み取り専用で参照するだけで、書き換えることはありません。</footer>
</main>

<script>
"use strict";
/* ============================================================
   導き v10 — 「週の賭けと上昇線」状態管理
   ============================================================ */
const STORE_KEY = "michibiki:v2";
const COMPASS_KEY = "hyakuoku-compass:v1"; // 読み取り専用。絶対に書き込まない。
const $ = id => document.getElementById(id);

const TAGS = ["稼ぐ", "守る", "増やす", "整える"];
const BET_TEMPLATES = ["資産を記録する", "積立を実行する", "出費を見直す", "本業で成果を1つ"];
const MILESTONES = [
  { v: 1e6,  label: "100万" },
  { v: 1e7,  label: "1,000万" },
  { v: 3e7,  label: "3,000万" },
  { v: 1e8,  label: "1億" },
  { v: 3e8,  label: "3億" },
  { v: 1e9,  label: "10億" },
  { v: 3e9,  label: "30億" },
  { v: 1e10, label: "100億" },
];

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function fmtYen(v) {
  if (!isFinite(v)) return "—";
  v = Math.round(v);
  const neg = v < 0; v = Math.abs(v);
  const oku = Math.floor(v / 1e8);
  const man = Math.floor((v % 1e8) / 1e4);
  const en = v % 1e4;
  let s = "";
  if (oku) s += oku.toLocaleString("ja-JP") + "億";
  if (man) s += man.toLocaleString("ja-JP") + "万";
  if (!oku && !man) s += en.toLocaleString("ja-JP");
  else if (en && !oku) s += en.toLocaleString("ja-JP");
  return (neg ? "-" : "") + s + "円";
}

// ISO週(月曜開始)キー "YYYY-Wnn"
function isoWeekKey(now = new Date()) {
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // 月=0 ... 日=6
  d.setUTCDate(d.getUTCDate() - dayNum + 3); // その週の木曜日
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  const weekNum = 1 + Math.round((d - firstThursday) / (7 * 86400000));
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}
function weekKeyLabel(wk) {
  if (!wk) return "";
  const m = /^(\d{4})-W(\d{2})$/.exec(wk);
  return m ? `${m[1]}年 第${parseInt(m[2], 10)}週` : wk;
}
// isoWeekKey の逆算: そのISO週の月曜日(UTC基準のDateオブジェクト。カレンダー上の日付はUTCゲッタで取り出す)
function isoWeekMonday(wk) {
  const m = /^(\d{4})-W(\d{2})$/.exec(wk);
  if (!m) return null;
  const year = +m[1], week = +m[2];
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = (jan4.getUTCDay() + 6) % 7; // 月=0
  const week1Monday = new Date(jan4.getTime() - jan4Day * 86400000);
  return new Date(week1Monday.getTime() + (week - 1) * 7 * 86400000);
}
function fmtUTCDateStr(d) {
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

/* ============================================================
   コンパスのデータ(読み取り専用)
   ============================================================ */
function readCompass() {
  try {
    const raw = localStorage.getItem(COMPASS_KEY);
    if (!raw) return { records: [], habits: [], opens: {} };
    const parsed = JSON.parse(raw) || {};
    return {
      records: Array.isArray(parsed.records)
        ? parsed.records.filter(r => r && typeof r.d === "string" && typeof r.v === "number")
        : [],
      habits: Array.isArray(parsed.habits) ? parsed.habits : [],
      opens: (parsed.opens && typeof parsed.opens === "object") ? parsed.opens : {},
    };
  } catch (e) {
    console.warn("コンパスデータの読み込みに失敗しました", e);
    return { records: [], habits: [], opens: {} };
  }
}
function sortedRecords(compass) {
  return compass.records.slice().sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
}
// 最新の資産記録額。記録が1件もなければ null(概念ヘッダー/マイルストーン判定で「データ無し」を区別するため)。
function getCurrentAssetsOrNull(compass) {
  const c = compass || readCompass();
  const sorted = sortedRecords(c);
  return sorted.length ? sorted[sorted.length - 1].v : null;
}
// 指定週の月曜日時点で有効な資産額(その日以前の最新記録)。無ければ null。
function assetValueAtWeek(sortedRecs, wk) {
  const monday = isoWeekMonday(wk);
  if (!monday) return null;
  const mondayStr = fmtUTCDateStr(monday);
  let val = null;
  for (const r of sortedRecs) {
    if (r.d <= mondayStr) val = r.v; else break;
  }
  return val;
}
// 次のマイルストーンと、そこまでの距離(比率)。assetsがnull、または既に最終マイルストーン到達済みならnull。
function nextMilestoneInfo(assets) {
  if (assets == null) return null;
  const next = MILESTONES.find(m => m.v > assets);
  if (!next) return null;
  const prevV = MILESTONES.filter(m => m.v <= assets).map(m => m.v).pop() || 0;
  const remain = next.v - assets;
  const ratio = (next.v - assets) / (next.v - prevV);
  return { label: next.label + "円", remain, ratio };
}

/* ============================================================
   導き自身のデータ(michibiki:v2)
   ============================================================ */
function defaultGuideState() {
  return { weeks: {}, slots: 3, image: { weekKey: null, text: "" } };
}
function sanitizeItem(i) {
  if (!i || typeof i !== "object") return null;
  if (typeof i.id !== "string" || typeof i.text !== "string") return null;
  const tag = TAGS.includes(i.tag) ? i.tag : TAGS[0];
  return { id: i.id, text: String(i.text).slice(0, 100), tag, cleared: !!i.cleared };
}
function sanitizeWeek(w) {
  if (!w || typeof w !== "object") return { items: [], settled: false, feel: null };
  const items = Array.isArray(w.items) ? w.items.map(sanitizeItem).filter(Boolean) : [];
  const settled = !!w.settled;
  const feel = (w.feel === true || w.feel === false) ? w.feel : null;
  return { items, settled, feel };
}
function migrateGuideState(parsed) {
  const s = defaultGuideState();
  if (!parsed || typeof parsed !== "object") return s;
  if (parsed.weeks && typeof parsed.weeks === "object") {
    Object.keys(parsed.weeks).forEach(k => {
      if (/^\d{4}-W\d{2}$/.test(k)) s.weeks[k] = sanitizeWeek(parsed.weeks[k]);
    });
  }
  s.slots = (typeof parsed.slots === "number" && parsed.slots >= 1 && parsed.slots <= 7)
    ? Math.round(parsed.slots) : 3;
  if (parsed.image && typeof parsed.image === "object" && typeof parsed.image.text === "string"
      && (parsed.image.weekKey === null || /^\d{4}-W\d{2}$/.test(parsed.image.weekKey))) {
    s.image = { weekKey: parsed.image.weekKey, text: parsed.image.text };
  }
  // v1(michibiki:v1)のフィールドが紛れ込んでいても、対象外として黙って捨てる(エラーにしない)。
  return s;
}
function loadGuideState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultGuideState();
    return migrateGuideState(JSON.parse(raw));
  } catch (e) {
    console.warn("導きデータの読み込みに失敗しました", e);
    return defaultGuideState();
  }
}
function saveGuideState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(guideState)); }
  catch (e) { console.warn("導きデータの保存に失敗しました", e); }
}
let guideState = loadGuideState();

/* ============================================================
   週スコア / 累積 / 自動清算
   ============================================================ */
function computeWeekScore(w) {
  const cleared = w.items.filter(i => i.cleared).length;
  const uncleared = w.items.length - cleared;
  return w.settled ? (cleared - uncleared) : cleared; // 清算前は暫定(cleared数のみ)、清算後は cleared-uncleared
}
function formatScore(n) {
  return (n > 0 ? "+" : "") + n;
}
// 全週(現在週含む)を週キー昇順に並べ、総合累積・実感累積を積み上げる。
function buildWeekSeriesAll() {
  const keys = Object.keys(guideState.weeks).sort();
  let cum = 0, feelCum = 0;
  return keys.map(k => {
    const w = guideState.weeks[k];
    const score = computeWeekScore(w);
    cum += score;
    const feelDelta = w.feel === true ? 1 : w.feel === false ? -1 : 0;
    feelCum += feelDelta;
    return { weekKey: k, score, cumulative: cum, feel: w.feel, feelCumulative: feelCum, settled: w.settled };
  });
}
// 清算済みの週だけを週キー昇順で返す(上昇イメージ・勝率判定・枠昇降ルールで共用)。
function settledWeeksAscending(excludeWk) {
  return Object.keys(guideState.weeks)
    .filter(k => k !== excludeWk && guideState.weeks[k].settled)
    .sort()
    .map(k => ({ weekKey: k, score: computeWeekScore(guideState.weeks[k]), feel: guideState.weeks[k].feel }));
}

/* ============================================================
   上昇イメージ(Fable 5 の思い。8分岐の文章は一字一句そのまま・改変禁止)
   ============================================================ */
const RISING_TEXT_1 = "最初の一本は、まだ地面を這っている。それでいい。線は嘘をつかない — 賭けを置いた時点で、もう昇り始めている。";
const RISING_TEXT_2 = "スコアは上がっている。だが自由に近づいた実感がないなら、線は正しい山を登っていない。約束をひとつ、車と自由に直結するものに入れ替える時だ。";
const RISING_TEXT_4 = "先週、線は下がった。下がった線だけが教えてくれることがある — 賭けすぎたか、約束が重すぎたかだ。今週は絞って、まず一本勝て。";
const RISING_TEXT_6 = "今は守りの週だ。項目を減らすのは後退ではない — 線を折らないことが、上昇の最低条件だ。";
const RISING_TEXT_8 = "線は横ばいだ。悪くない。だが100億は横ばいの先にはない。今週、ひとつだけ普段より重い約束を置いてみろ。";
function risingText3(n, milestoneLabel) {
  return `線は${n}週続けて上を向いている。角度は才能ではなく、選んだ約束の質だ。この傾きのまま行けば、${milestoneLabel}が視界に入る。`;
}
function risingText5(rate) {
  return `勝率${rate}%。賭け金が小さすぎる合図だ。枠を増やせ。伸び幅は、引き受けた下げ幅の分だけ広がる。`;
}
function risingText7(milestoneLabel, remainLabel) {
  return `${milestoneLabel}まで、あと${remainLabel}。数字は冷たいが、その向こうにあるのはガレージと、誰にも縛られない朝だ。`;
}
// 直近n週(利用可能な範囲)の勝率(勝ち=スコア>0)。settledWeeksAscが空ならnull。
function winRateLastN(weeksAsc, n) {
  const recent = weeksAsc.slice(-n);
  if (!recent.length) return null;
  const wins = recent.filter(w => w.score > 0).length;
  return { rate: Math.round((wins / recent.length) * 100), wins, count: recent.length };
}
// 直近から遡って、スコア>0が何週連続しているか。
function consecutivePositiveStreak(weeksAsc) {
  let streak = 0;
  for (let i = weeksAsc.length - 1; i >= 0; i--) {
    if (weeksAsc[i].score > 0) streak++; else break;
  }
  return streak;
}
// 直近3週のスコアが単調増加、かつそのうちfeel=falseが2回以上か。
function risingTrendLowFeel(weeksAsc) {
  if (weeksAsc.length < 3) return false;
  const r3 = weeksAsc.slice(-3);
  const increasing = r3[0].score < r3[1].score && r3[1].score < r3[2].score;
  const noFeelCount = r3.filter(w => w.feel === false).length;
  return increasing && noFeelCount >= 2;
}
// 上昇イメージ8分岐(優先順位1→8)。weeksAsc は清算済み週のみ・週キー昇順。assets はコンパスの現在資産(無ければnull)。
function computeRisingImage(weeksAsc, assets) {
  if (!weeksAsc.length) return RISING_TEXT_1;

  if (risingTrendLowFeel(weeksAsc)) return RISING_TEXT_2;

  const streak = consecutivePositiveStreak(weeksAsc);
  if (streak >= 2) {
    const ms = nextMilestoneInfo(assets);
    if (ms) return risingText3(streak, ms.label);
  }

  const last = weeksAsc[weeksAsc.length - 1];
  if (last.score < 0) return RISING_TEXT_4;

  const wr = winRateLastN(weeksAsc, 4);
  if (wr && wr.rate >= 70) return risingText5(wr.rate);
  if (wr && wr.rate < 40) return RISING_TEXT_6;

  const ms2 = nextMilestoneInfo(assets);
  if (ms2 && ms2.ratio <= 0.2) return risingText7(ms2.label, fmtYen(ms2.remain));

  return RISING_TEXT_8;
}

/* ============================================================
   コピー堅牢化(既存ロジックをそのまま流用)
   ============================================================ */
function fallbackCopyToClipboard(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { console.warn("コピーに失敗しました", e); return false; }
}
function copyTextToClipboard(text) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      resolve(!!ok);
    };
    const timer = setTimeout(() => finish(fallbackCopyToClipboard(text)), 800);
    let writePromise = null;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        writePromise = navigator.clipboard.writeText(text);
      }
    } catch (e) {
      writePromise = null;
    }
    if (writePromise && typeof writePromise.then === "function") {
      writePromise.then(
        () => { clearTimeout(timer); finish(true); },
        () => { clearTimeout(timer); finish(fallbackCopyToClipboard(text)); }
      );
    } else {
      clearTimeout(timer);
      finish(fallbackCopyToClipboard(text));
    }
  });
}
const COPY_SUCCESS_LABEL = "✓ コピーした";
const COPY_FAIL_LABEL = "コピーできなかった";
function wireCopyButton(btn, getText, defaultLabel) {
  let feedbackTimer = null;
  const showFeedback = (ok) => {
    if (feedbackTimer) clearTimeout(feedbackTimer);
    btn.textContent = ok ? COPY_SUCCESS_LABEL : COPY_FAIL_LABEL;
    feedbackTimer = setTimeout(() => {
      btn.textContent = defaultLabel;
      feedbackTimer = null;
    }, 2000);
  };
  btn.addEventListener("click", () => {
    let text;
    try {
      text = getText();
    } catch (e) {
      console.warn("コピー用テキストの生成に失敗しました", e);
      showFeedback(false);
      return;
    }
    Promise.resolve()
      .then(() => copyTextToClipboard(text))
      .catch(() => false)
      .then(showFeedback);
  });
}

/* ============================================================
   5. 上昇線(SVG折れ線・コンパスのチャート実装パターンを踏襲)
   ============================================================ */
// 汎用: 複数系列の値からゆとりを持たせたY軸ドメインを作る(min===maxなら±1で回避)。
function niceDomain(valuesList) {
  const finite = [];
  valuesList.forEach(arr => arr.forEach(v => { if (v != null && isFinite(v)) finite.push(v); }));
  if (!finite.length) return [0, 1];
  let min = Math.min(...finite), max = Math.max(...finite);
  if (min === max) { min -= 1; max += 1; } else { const pad = (max - min) * 0.12; min -= pad; max += pad; }
  return [min, max];
}
// 系列を別ドメイン[targetMin,targetMax]に正規化する(資産のような別スケールの値を同じ図に重ねるため)。
// 有効値が2点未満なら形が描けないためnull埋め(呼び出し側で自然に描画されなくなる)。
function rescaleToRange(values, targetMin, targetMax) {
  const finite = values.filter(v => v != null && isFinite(v));
  if (finite.length < 2) return values.map(() => null);
  const min = Math.min(...finite), max = Math.max(...finite);
  if (min === max) return values.map(v => v == null ? null : (targetMin + targetMax) / 2);
  return values.map(v => v == null ? null : targetMin + (v - min) / (max - min) * (targetMax - targetMin));
}
// null(欠損)で線を分断しながらSVGパス文字列を作る。
function pathWithGaps(values, xFn, yFn) {
  let d = "", started = false;
  values.forEach((v, i) => {
    if (v == null) { started = false; return; }
    d += (started ? "L" : "M") + xFn(i).toFixed(1) + " " + yFn(v).toFixed(1) + " ";
    started = true;
  });
  return d.trim();
}
function svgEl(NS, name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildMainChartData() {
  const series = buildWeekSeriesAll();
  if (series.length < 2) return null;
  const weekKeys = series.map(s => s.weekKey);
  const cumulative = series.map(s => s.cumulative);
  const feelCumulative = series.map(s => s.feelCumulative);
  const past = series.map((s, i) => i >= 4 ? series[i - 4].cumulative : null); // 4週前までの自分
  const sorted = sortedRecords(readCompass());
  const assetsRaw = weekKeys.map(wk => assetValueAtWeek(sorted, wk));
  return { weekKeys, cumulative, feelCumulative, past, assetsRaw };
}

function renderMainChart() {
  const host = $("line-chart");
  const legend = $("line-chart-legend");
  const wrap = $("line-chart-wrap");
  const tableWrap = $("line-table-view");
  const toggleBtn = $("toggle-line-table");
  const tagDetail = $("tag-detail");
  host.innerHTML = "";

  const data = buildMainChartData();
  if (!data) {
    legend.hidden = true;
    toggleBtn.hidden = true;
    $("line-chart-sub").textContent = "";
    const empty = document.createElement("div");
    empty.className = "chart-empty";
    empty.textContent = "線は2週目から現れる。まず今週を生き延びろ。";
    host.appendChild(empty);
    tableWrap.innerHTML = ""; tableWrap.hidden = true;
    tagDetail.hidden = true;
    wrap.setAttribute("aria-label", "上昇線チャート。データが2週分たまると表示されます。");
    return;
  }
  tagDetail.hidden = false;
  toggleBtn.hidden = false;
  legend.hidden = false;
  $("line-chart-sub").textContent = "週ごとの累積スコア";
  wrap.setAttribute("aria-label", "上昇線チャート。総合累積・実感累積・資産・4週前の自分の最大4本。詳細は「表で見る」から確認できます。");

  const domain = niceDomain([data.cumulative, data.feelCumulative, data.past]);
  const assetsScaled = rescaleToRange(data.assetsRaw, domain[0], domain[1]);

  const css = getComputedStyle(document.documentElement);
  const C = {
    s1: css.getPropertyValue("--series-1").trim(),
    s2: css.getPropertyValue("--series-2").trim(),
    muted: css.getPropertyValue("--text-muted").trim(),
    secondary: css.getPropertyValue("--text-secondary").trim(),
    axis: css.getPropertyValue("--axis").trim(),
    grid: css.getPropertyValue("--grid").trim(),
  };

  const n = data.weekKeys.length;
  const W = Math.max(320, wrap.clientWidth);
  const H = 280;
  const pad = { top: 16, right: 16, bottom: 30, left: 40 };
  const pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;
  const x = i => n <= 1 ? pad.left + pw / 2 : pad.left + (i / (n - 1)) * pw;
  const y = v => pad.top + (1 - (v - domain[0]) / (domain[1] - domain[0])) * ph;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const el = (name, attrs) => svgEl(NS, name, attrs);

  svg.appendChild(el("line", { x1: pad.left, x2: pad.left + pw, y1: y(0), y2: y(0), stroke: C.grid, "stroke-width": 1 }));
  svg.appendChild(el("line", { x1: pad.left, x2: pad.left + pw, y1: pad.top + ph, y2: pad.top + ph, stroke: C.axis, "stroke-width": 1 }));

  const maxLabels = Math.max(2, Math.floor(pw / 60));
  const step = Math.max(1, Math.ceil(n / maxLabels));
  data.weekKeys.forEach((wk, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const m = /-W(\d{2})$/.exec(wk);
    const label = el("text", { x: x(i), y: pad.top + ph + 18, "text-anchor": "middle", fill: C.muted, "font-size": 10.5 });
    label.textContent = m ? "W" + m[1] : wk;
    svg.appendChild(label);
  });

  // 資産(薄・背景) — 最初に描いて背面に回す
  svg.appendChild(el("path", { d: pathWithGaps(assetsScaled, x, y), fill: "none", stroke: C.muted, "stroke-width": 2, opacity: 0.28 }));
  // 4週前までの自分(薄い過去線)
  svg.appendChild(el("path", { d: pathWithGaps(data.past, x, y), fill: "none", stroke: C.secondary, "stroke-width": 1.5, "stroke-dasharray": "2 3", opacity: 0.55 }));
  // 実感累積線(点線)
  svg.appendChild(el("path", { d: pathWithGaps(data.feelCumulative, x, y), fill: "none", stroke: C.s2, "stroke-width": 2, "stroke-dasharray": "6 5" }));
  // 総合累積線(太)
  svg.appendChild(el("path", { d: pathWithGaps(data.cumulative, x, y), fill: "none", stroke: C.s1, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  const lastI = n - 1;
  svg.appendChild(el("circle", { cx: x(lastI), cy: y(data.cumulative[lastI]), r: 5, fill: C.s1 }));

  host.appendChild(svg);
  renderLineTable(data);
}
function renderLineTable(data) {
  const wrap = $("line-table-view");
  wrap.innerHTML = "";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");

    });

}
$("toggle-line-table").addEventListener("click", () => {

/* ---- タグ別4本(詳細・折りたたみ内) ---- */
function buildTagChartData() {
  const keys = Object.keys(guideState.weeks).sort();
  if (keys.length < 2) return null;
  const cum = {}; TAGS.forEach(t => cum[t] = 0);
  const series = {}; TAGS.forEach(t => series[t] = []);
  keys.forEach(k => {
    const w = guideState.weeks[k];
    TAGS.forEach(t => {
      const items = w.items.filter(i => i.tag === t);
      const cleared = items.filter(i => i.cleared).length;
      const uncleared = items.length - cleared;
      const score = w.settled ? (cleared - uncleared) : cleared;
      cum[t] += score;
      series[t].push(cum[t]);
    });
  });
  return { weekKeys: keys, series };
}
function renderTagChart() {
  const host = $("tag-chart");
  const tableWrap = $("tag-table-view");
  const chartWrap = $("tag-chart-wrap");
  host.innerHTML = "";
  const data = buildTagChartData();
  if (!data) {
    const empty = document.createElement("div");
    empty.className = "chart-empty";
    empty.textContent = "線は2週目から現れる。まず今週を生き延びろ。";
    host.appendChild(empty);
    tableWrap.innerHTML = "";
    return;
  }
  const css = getComputedStyle(document.documentElement);
  const colors = {
    "稼ぐ": css.getPropertyValue("--series-1").trim(),
    "守る": css.getPropertyValue("--series-2").trim(),
    "増やす": css.getPropertyValue("--series-3").trim(),
    "整える": css.getPropertyValue("--series-4").trim(),
  };
  const domain = niceDomain(TAGS.map(t => data.series[t]));
  const n = data.weekKeys.length;
  const W = Math.max(280, chartWrap.clientWidth);
  const H = 220;
  const pad = { top: 14, right: 14, bottom: 26, left: 36 };
  const pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;
  const x = i => n <= 1 ? pad.left + pw / 2 : pad.left + (i / (n - 1)) * pw;
  const y = v => pad.top + (1 - (v - domain[0]) / (domain[1] - domain[0])) * ph;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const el = (name, attrs) => svgEl(NS, name, attrs);
  svg.appendChild(el("line", { x1: pad.left, x2: pad.left + pw, y1: pad.top + ph, y2: pad.top + ph, stroke: css.getPropertyValue("--axis").trim(), "stroke-width": 1 }));
  TAGS.forEach(t => {
    svg.appendChild(el("path", { d: pathWithGaps(data.series[t], x, y), fill: "none", stroke: colors[t], "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  });
  host.appendChild(svg);

  tableWrap.innerHTML = "";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  ["週", ...TAGS].forEach(t => { const th = document.createElement("th"); th.textContent = t; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  data.weekKeys.forEach((wk, i) => {
    const tr = document.createElement("tr");
    [weekKeyLabel(wk), ...TAGS.map(t => formatScore(data.series[t][i]))].forEach(t => {
      const td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
}
// <details>が閉じている間は幅が取れずチャートが潰れるため、開いた瞬間に再描画する。
$("tag-detail").addEventListener("toggle", () => { if ($("tag-detail").open) renderTagChart(); });

/* ============================================================
   6. メンターのポジション管理(枠の話だけ。説教はしない)
   ============================================================ */
function trailingWinRate(weeksAsc, uptoIndex, n) {
  const start = Math.max(0, uptoIndex - n + 1);
  const slice = weeksAsc.slice(start, uptoIndex + 1);
  if (!slice.length) return null;
  const wins = slice.filter(w => w.score > 0).length;
  return wins / slice.length;
}
function twoConsecutiveHighWinRate(weeksAsc) {
  const L = weeksAsc.length;
  if (L < 2) return false;
  const r1 = trailingWinRate(weeksAsc, L - 1, 4);
  const r2 = trailingWinRate(weeksAsc, L - 2, 4);
  return r1 != null && r2 != null && r1 >= 0.7 && r2 >= 0.7;
}
function twoConsecutiveLowWinRate(weeksAsc) {
  const L = weeksAsc.length;
  if (L < 2) return false;
  const r1 = trailingWinRate(weeksAsc, L - 1, 4);
  const r2 = trailingWinRate(weeksAsc, L - 2, 4);
  return r1 != null && r2 != null && r1 < 0.4 && r2 < 0.4;
}
function renderPosition() {
  const wrap = $("position-body");
  wrap.innerHTML = "";
  const settled = settledWeeksAscending(isoWeekKey());
  let text, action = null;
  if (twoConsecutiveHighWinRate(settled)) {
    if (guideState.slots >= 7) {
      text = "勝率は高いが、枠はもう上限(7)。今の枠数で勝ち切れ。";
    } else {
      text = "直近の勝率は高い。賭け金が小さすぎる合図だ。枠を1つ増やせる。";
      action = { label: "枠を増やす", run: () => { guideState.slots = Math.min(7, guideState.slots + 1); saveGuideState(); renderAll(); } };
    }
  } else if (twoConsecutiveLowWinRate(settled)) {
    if (guideState.slots <= 1) {
      text = "勝率は低いが、枠はもう下限(1)。今の1つに賭けろ。";
    } else {
      text = "直近の勝率は低い。枠を1つ絞ろう。";
      action = { label: "枠を減らす", run: () => { guideState.slots = Math.max(1, guideState.slots - 1); saveGuideState(); renderAll(); } };
    }
  } else {
    text = `枠は${guideState.slots}のままでいい。今の重さを勝ち切れ。`;
  }
  const p = document.createElement("div");
  p.className = "position-text";
  p.textContent = text;
  wrap.appendChild(p);
  if (action) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "primary"; btn.style.marginTop = "10px";
    btn.textContent = action.label;
    btn.addEventListener("click", action.run);
    wrap.appendChild(btn);
  }
}

/* ============================================================
   7. AI連携
   ============================================================ */
const AI_PROMPT_HEAD = `あなたは俺専属の参謀でありメンターだ。俺の目標は「好きな車に乗る、自由な生活」。そのための数値目標は100億円。
以下は週の賭け(約束)の記録だ。忖度なしで見ろ。

【出力形式】
1. 評価(直近の傾向を一言で)
2. よくやった点(1つだけ)
3. 一番の問題(1つだけ、遠慮なく)
4. 来週の賭けの構成(具体的な項目案。抽象論禁止)
5. 枠(slots)についての助言

参謀でありメンターとして、来週の賭けの構成を提案しろ。

【週次データ】
`;
function buildWeeklyReport(weekLimit) {
  const all = buildWeekSeriesAll();
  const use = typeof weekLimit === "number" ? all.slice(-weekLimit) : all;
  const compass = readCompass();
  const assets = getCurrentAssetsOrNull(compass);
  const lines = [];
  lines.push(`現在資産: ${assets != null ? fmtYen(assets) : "記録なし"}`);
  lines.push(`現在の枠(slots): ${guideState.slots}`);
  lines.push("");
  use.forEach(w => {
    const week = guideState.weeks[w.weekKey];
    const total = week.items.length;
    const cleared = week.items.filter(i => i.cleared).length;
    const tagCounts = TAGS.map(t => {
      const items = week.items.filter(i => i.tag === t);
      return `${t}${items.filter(i => i.cleared).length}/${items.length}`;
    }).join(" ");
    const feelText = week.feel === true ? "はい" : week.feel === false ? "いいえ" : "—";
    lines.push(`${weekKeyLabel(w.weekKey)}: スコア${formatScore(w.score)}(累積${formatScore(w.cumulative)}) 達成${cleared}/${total} 実感${feelText} [${tagCounts}]`);
  });
  lines.push("");
  const settled = settledWeeksAscending(isoWeekKey());
  const wr = winRateLastN(settled, 4);
  lines.push(`直近4週勝率: ${wr ? wr.rate + "%" : "記録なし"}`);
  return lines.join("\n");
}
function buildAIPrompt(weekLimit) { return AI_PROMPT_HEAD + buildWeeklyReport(weekLimit); }
function buildAIReportURL() {
  let weekLimit = 12;
  let prompt = buildAIPrompt(weekLimit);
  let url = "https://claude.ai/new?q=" + encodeURIComponent(prompt);
  while (url.length > 7000 && weekLimit > 1) {
    weekLimit -= 1;
    prompt = buildAIPrompt(weekLimit);
    url = "https://claude.ai/new?q=" + encodeURIComponent(prompt);
  }
  return { url, prompt, weekLimit };
}
function renderAI() {
  const wrap = $("ai-body");
  wrap.innerHTML = "";
  const note = document.createElement("div");
  note.className = "ai-review-note";
  note.textContent = "あなたのClaudeアカウントで開きます。コピーして好きなAIに貼ってもいい。データが送られるのはボタンを押した時だけです。";
  wrap.appendChild(note);

  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";
  const mainBtn = document.createElement("button");
  mainBtn.type = "button"; mainBtn.className = "primary";
  mainBtn.textContent = "Claudeに週次を見てもらう";
  mainBtn.setAttribute("aria-label", "Claudeに週次を見てもらう(新しいタブでclaude.aiが開きます)");
  mainBtn.addEventListener("click", () => { const { url } = buildAIReportURL(); window.open(url, "_blank"); });
  btnRow.appendChild(mainBtn);

  const copyBtn = document.createElement("button");
  copyBtn.type = "button"; copyBtn.className = "ghost";
  copyBtn.textContent = "📋 査定文をコピー";
  copyBtn.setAttribute("aria-label", "査定用のプロンプトをコピーする");
  wireCopyButton(copyBtn, () => buildAIReportURL().prompt, "📋 査定文をコピー");
  btnRow.appendChild(copyBtn);
  wrap.appendChild(btnRow);
}

/* ============================================================
   通知ペイロード(sw.js のロジックは変更しない。既存の{headline,goal,updatedAt}契約に載せるだけ)
   ============================================================ */
function firstSentence(text) {
  const idx = text.indexOf("。");
  return idx >= 0 ? text.slice(0, idx + 1) : text;
}
// 月曜/日曜以外は payload を書かない(古いまま残し、sw.js側の48h超フォールバックに委ねる)。
function computeNotifyPayload(now) {
  now = now || new Date();
  const wd = now.getDay();
  if (wd === 1) {
    return { headline: firstSentence(guideState.image.text || ""), goal: "今週の賭けを決めろ", updatedAt: now.toISOString() };
  }
  if (wd === 0) {
    return { headline: "清算の時間だ。線に今週の答えを刻め", goal: "", updatedAt: now.toISOString() };
  }
  return null;
}
function writeNotifyPayload() {
  try {
    if (typeof caches === "undefined") return;
    const payload = computeNotifyPayload();
    if (!payload) return;
    caches.open("michibiki-notify")
      .then(c => c.put("payload", new Response(JSON.stringify(payload))))
      .catch(() => {});
  } catch (e) { /* Cache API未対応/失敗は無視 */ }
}

// 入力時の視界確保(モバイルのキーボード対策)。既存ロジックをそのまま流用。
function scrollTextInputIntoView(t) {
  if (t && t.tagName === "INPUT" && t.type === "text" && !t.disabled && typeof t.scrollIntoView === "function") {
    requestAnimationFrame(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
    });
  }
}
document.addEventListener("focusin", e => scrollTextInputIntoView(e.target));
document.addEventListener("click", e => scrollTextInputIntoView(e.target));
document.addEventListener("touchstart", e => scrollTextInputIntoView(e.target), { passive: true });

$("export-btn").addEventListener("click", () => {
  try {
    const blob = new Blob([JSON.stringify(guideState, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `michibiki-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { console.warn("書き出しに失敗しました", e); }
});
$("import-btn").addEventListener("click", () => $("import-file").click());
$("import-file").addEventListener("change", () => {
  const file = $("import-file").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!confirm("現在の「導き」データを読み込んだ内容で置き換えます。よろしいですか?")) return;
      guideState = migrateGuideState(parsed);
      saveGuideState();
      settleUI = { step: "idle" };
      addTagSelected = TAGS[0];
      renderAll();
    } catch (err) {
      alert("読み込みに失敗しました: " + err.message);
    }
    $("import-file").value = "";
  };
  reader.readAsText(file);
});

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
